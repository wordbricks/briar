display_information:
  name: Briar
  description: Create Briar issues from Slack mentions
  background_color: "#4a154b"
features:
  bot_user:
    display_name: Briar
    always_online: false
  shortcuts:
    - name: Create a Briar issue
      type: global
      callback_id: briar_create_issue_shortcut
      description: Create a new Briar issue
  slash_commands:
    - command: /create
      url: https://YOUR_BRIAR_API_HOST/slack/commands
      description: Create a Briar issue
      usage_hint: "[optional issue title]"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://YOUR_BRIAR_API_HOST/slack/oauth/callback
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - commands
      - files:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR_BRIAR_API_HOST/slack/interactions
  event_subscriptions:
    request_url: https://YOUR_BRIAR_API_HOST/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
