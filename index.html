<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f7f3" />
    <link
      rel="icon"
      type="image/png"
      href="/src/assets/app-icons/aubergine-riso.png"
    />
    <title>Briar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const describeStartupError = (value) => {
          if (value instanceof Error) {
            return `${value.name}: ${value.message}\n\n${value.stack ?? ""}`;
          }
          return String(value);
        };
        const revealStartupError = (value) => {
          const root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          const error = document.createElement("pre");
          error.id = "briar-startup-error";
          error.style.cssText =
            "box-sizing:border-box;min-height:100vh;margin:0;padding:32px;" +
            "overflow:auto;white-space:pre-wrap;color:#6b2424;background:#f7f7f3;" +
            "font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace";
          error.textContent = `BRIAR STARTUP ERROR\n\n${describeStartupError(value)}`;
          root.replaceChildren(error);
        };
        window.addEventListener("error", (event) => {
          revealStartupError(event.error ?? event.message);
        });
        window.addEventListener("unhandledrejection", (event) => {
          revealStartupError(event.reason);
        });
        window.setTimeout(() => {
          const root = document.getElementById("root");
          if (!root || root.childElementCount > 0) return;
          revealStartupError("The application bundle did not initialize within 5 seconds.");
        }, 5_000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
