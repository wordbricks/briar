name: Briar release artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS release artifact
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build ad-hoc-signed release candidate with ephemeral updater trust
        run: scripts/qa-production-updater-build.sh
      - name: Package candidate and checksums
        run: scripts/package-macos-release.sh
      - name: Smoke-test isolated install and rollback
        run: |
          scripts/qa-macos-lifecycle.sh \
            --previous-dir release-artifacts \
            --candidate-dir release-artifacts \
            --allow-same-version \
            --evidence-file release-artifacts/lifecycle-evidence.json
          (
            cd release-artifacts
            shasum -a 256 -- lifecycle-evidence.json >> SHA256SUMS
            shasum -a 256 --check SHA256SUMS
          )
      - name: Prove ad-hoc candidate cannot satisfy Production trust
        run: |
          rejection_log="$RUNNER_TEMP/production-signature-rejection.log"
          if scripts/qa-macos-lifecycle.sh \
            --previous-dir release-artifacts \
            --candidate-dir release-artifacts \
            --allow-same-version \
            --require-production-signature \
            >"$rejection_log" 2>&1; then
            echo "Ad-hoc RC unexpectedly passed the Production signature gate." >&2
            exit 1
          fi
          grep -F \
            "Production candidate is not signed by a Developer ID Application identity." \
            "$rejection_log"
      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: briar-macos-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
