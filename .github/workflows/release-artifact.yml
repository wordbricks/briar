name: Briar release artifact

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: macOS release artifact
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build unsigned release candidate
        run: bun run tauri:build:release
      - name: Package candidate and checksums
        run: scripts/package-macos-release.sh
      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: briar-macos-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-tag:
    name: Draft tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: briar-macos-${{ github.sha }}
          path: release-artifacts
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --title "Briar ${GITHUB_REF_NAME}"
