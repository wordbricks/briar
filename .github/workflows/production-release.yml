name: Briar Production release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish-macos:
    name: Sign, notarize, attest, and publish macOS
    runs-on: macos-latest
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ steps.release-url.outputs.url }}
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIAR_UPDATER_PUBLIC_KEY: ${{ vars.BRIAR_UPDATER_PUBLIC_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout complete source history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Resolve release version
        run: |
          echo "BRIAR_VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"
          set -a
          source config/release.env
          set +a
          echo "BRIAR_UPDATE_ENDPOINT=$BRIAR_UPDATE_ENDPOINT" >> "$GITHUB_ENV"
          echo "BRIAR_RELEASE_BASE_URL=$BRIAR_RELEASE_BASE_URL" >> "$GITHUB_ENV"
      - name: Fail-closed Production preflight
        run: scripts/with-release-env.sh bun run src-cli/production-release.ts preflight --version "$BRIAR_VERSION"
      - name: Verify tag commit belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Import Apple signing and notarization assets
        run: scripts/import-apple-signing-assets.sh
      - name: Generate secret-free Tauri Production config
        run: scripts/with-release-env.sh bun run src-cli/production-release.ts config --version "$BRIAR_VERSION" --output "$RUNNER_TEMP/tauri.production.json"
      - name: Build, sign, notarize, and staple
        run: scripts/with-release-env.sh bun run tauri build --config "$RUNNER_TEMP/tauri.production.json"
      - name: Install checksum-pinned Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Package Production evidence
        run: scripts/package-production-release.sh
      - name: Verify isolated install and rollback mechanics
        run: |
          scripts/qa-macos-lifecycle.sh \
            --previous-dir release-artifacts \
            --candidate-dir release-artifacts \
            --allow-same-version \
            --require-production-signature \
            --evidence-file release-artifacts/lifecycle-evidence.json
          bun run tauri signer sign release-artifacts/lifecycle-evidence.json
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 shasum -a 256 -- > SHA256SUMS
            shasum -a 256 --check SHA256SUMS
          )
      - name: Upload immutable workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: briar-production-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 90
      - name: Create draft release transaction
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Briar $GITHUB_REF_NAME"
      - name: Upload versioned assets to private R2
        run: |
          for artifact in release-artifacts/*; do
            name="$(basename "$artifact")"
            bunx wrangler r2 object put \
              "briar-releases/releases/$GITHUB_REF_NAME/$name" \
              --file "$artifact" \
              --remote
          done
      - name: Verify versioned public updater asset
        run: curl --fail --silent --show-error --head "${BRIAR_RELEASE_BASE_URL}/${GITHUB_REF_NAME}/Briar.app.tar.gz"
      - name: Publish GitHub release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Atomically promote updater manifest
        run: |
          bunx wrangler r2 object put \
            "briar-releases/releases/latest.json" \
            --file release-artifacts/latest.json \
            --remote
          curl --fail --silent --show-error "${BRIAR_UPDATE_ENDPOINT}?promoted=${BRIAR_VERSION}" \
            | jq -e --arg version "$BRIAR_VERSION" '.version == $version'
      - name: Capture release URL
        id: release-url
        run: echo "url=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_OUTPUT"
      - name: Remove ephemeral signing keychain
        if: always()
        run: |
          if [[ -n "${BRIAR_PRODUCTION_KEYCHAIN:-}" && -f "$BRIAR_PRODUCTION_KEYCHAIN" ]]; then
            security delete-keychain "$BRIAR_PRODUCTION_KEYCHAIN"
          fi
