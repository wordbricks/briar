name: Briar CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-worker:
    name: App and Worker quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Type-check app
        run: bun run check
      - name: Run regression tests
        run: bun run test
      - name: Check release lifecycle script syntax
        run: |
          bash -n \
            scripts/import-apple-signing-assets.sh \
            scripts/package-macos-release.sh \
            scripts/package-production-release.sh \
            scripts/qa-production-updater-build.sh \
            scripts/qa-macos-lifecycle.sh
      - name: Build app assets
        run: bun run build
      - name: Verify production-configured app assets
        run: bun run build:release
      - name: Type-check Worker
        run: bun run worker:check
      - name: Build Worker dry run
        run: bun run worker:build
      - name: Profile Worker startup
        run: bun run worker:startup

  d1-migrations:
    name: D1 migration contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Apply all D1 migrations from scratch
        run: bun run d1:migrate:local
      - name: Verify D1 lifecycle tests
        run: bun run test -- worker/src/db.test.ts

  rust:
    name: Rust quality
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
      - name: Prepare embedded CLI resource
        run: |
          bun install --frozen-lockfile
          bun run cli:build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  security:
    name: Dependency and secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Audit JavaScript dependencies
        run: bun run audit:dependencies
      - name: Install verified cargo-audit 0.22.2
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/cargo-audit.tar.gz \
            https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  /tmp/cargo-audit.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/cargo-audit.tar.gz -C /tmp
      - name: Audit Rust dependencies
        env:
          CARGO_AUDIT_BIN: /tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit
        run: scripts/audit-rust-dependencies.sh
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan Git history for secrets
        run: /tmp/gitleaks git --redact --no-banner --log-opts="--all" .
