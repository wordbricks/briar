name: BriarCompanion
options:
  bundleIdPrefix: app.briar.companion.native
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Dev Debug: debug
  Dev Release: release
  Production: release
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.2.52
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BriarCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: [AppIconGray, AppIconPink, AppIconGreen]
      configs:
        Dev Debug:
          BRIAR_DISPLAY_NAME: Briar Native Dev
          BRIAR_APNS_ENVIRONMENT: development
          DEVELOPMENT_TEAM: ""
          PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev
        Dev Release:
          BRIAR_DISPLAY_NAME: Briar Native Dev
          BRIAR_APNS_ENVIRONMENT: development
          DEVELOPMENT_TEAM: ""
          PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev
        Production:
          BRIAR_DISPLAY_NAME: Briar Companion
          BRIAR_APNS_ENVIRONMENT: production
          DEVELOPMENT_TEAM: QFJZ2V3829
          PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion
    entitlements:
      path: App/BriarCompanion.entitlements
      properties:
        aps-environment: $(BRIAR_APNS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:briar-api.wbai.workers.dev
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(BRIAR_DISPLAY_NAME)
        BriarAPNSEnvironment: $(BRIAR_APNS_ENVIRONMENT)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.briar.companion.authentication
            CFBundleURLSchemes:
              - briar-companion
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconGray:
              CFBundleIconName: AppIconGray
            AppIconPink:
              CFBundleIconName: AppIconPink
            AppIconGreen:
              CFBundleIconName: AppIconGreen
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconGray:
              CFBundleIconName: AppIconGray
            AppIconPink:
              CFBundleIconName: AppIconPink
            AppIconGreen:
              CFBundleIconName: AppIconGreen
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BriarCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../../../packages/mobile-contracts/fixtures/companion-v1.json
        buildPhase: resources
      - path: ../../../../packages/mobile-contracts/companion.openapi.yaml
        buildPhase: resources
    dependencies:
      - target: BriarCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev.tests
        GENERATE_INFOPLIST_FILE: true
  BriarCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BriarCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: BriarCompanion
schemes:
  BriarCompanion-Dev:
    build:
      targets:
        BriarCompanion: all
        BriarCompanionTests: [test]
        BriarCompanionUITests: [test]
    run:
      config: Dev Debug
      environmentVariables:
        BRIAR_API_URL: http://127.0.0.1:8787
    test:
      config: Dev Debug
      gatherCoverageData: true
      targets:
        - name: BriarCompanionTests
          parallelizable: true
        - name: BriarCompanionUITests
          parallelizable: false
    profile:
      config: Dev Release
    analyze:
      config: Dev Debug
    archive:
      config: Dev Release
  BriarCompanion-Production:
    build:
      targets:
        BriarCompanion: all
    run:
      config: Production
    profile:
      config: Production
    analyze:
      config: Production
    archive:
      config: Production
