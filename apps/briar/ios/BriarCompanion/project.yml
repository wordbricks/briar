name: BriarCompanion
packages:
  Connect:
    url: https://github.com/connectrpc/connect-swift.git
    exactVersion: 1.2.3
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    exactVersion: 1.38.1
options:
  bundleIdPrefix: app.briar.companion.native
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Dev Debug: debug
  Dev Release: release
  Production: release
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.2.52
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  BriarContracts:
    type: framework
    platform: iOS
    sources:
      - path: ../../../../packages/contracts/swift/Sources/BriarContracts
    dependencies:
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.contracts
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true
  BriarContractsMocks:
    type: framework.static
    platform: iOS
    sources:
      - path: ../../../../packages/contracts/swift/Sources/BriarContractsMocks
    # Contract generation removes Connect-Swift's unused ConnectMocks import for unary RPCs.
    # Its safety check fails generation before a streaming mock can require that runtime.
    dependencies:
      - target: BriarContracts
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.contracts.mocks
        GENERATE_INFOPLIST_FILE: true
        SKIP_INSTALL: true
  BriarCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: BriarContracts
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: [AppIconGray, AppIconPink, AppIconGreen]
      configs:
        Dev Debug:
          BRIAR_DISPLAY_NAME: Briar Native Dev
          BRIAR_APNS_ENVIRONMENT: development
          DEVELOPMENT_TEAM: ""
          PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev
        Dev Release:
          BRIAR_DISPLAY_NAME: Briar Native Dev
          BRIAR_APNS_ENVIRONMENT: development
          DEVELOPMENT_TEAM: ""
          PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev
        Production:
          BRIAR_DISPLAY_NAME: Briar Companion
          BRIAR_APNS_ENVIRONMENT: production
          DEVELOPMENT_TEAM: QFJZ2V3829
          PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion
    entitlements:
      path: App/BriarCompanion.entitlements
      properties:
        aps-environment: $(BRIAR_APNS_ENVIRONMENT)
        com.apple.developer.associated-domains:
          - applinks:briar-api.wbai.workers.dev
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(BRIAR_DISPLAY_NAME)
        BriarAPNSEnvironment: $(BRIAR_APNS_ENVIRONMENT)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.briar.companion.authentication
            CFBundleURLSchemes:
              - briar-companion
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconGray:
              CFBundleIconName: AppIconGray
            AppIconPink:
              CFBundleIconName: AppIconPink
            AppIconGreen:
              CFBundleIconName: AppIconGreen
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconGray:
              CFBundleIconName: AppIconGray
            AppIconPink:
              CFBundleIconName: AppIconPink
            AppIconGreen:
              CFBundleIconName: AppIconGreen
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BriarCompanionUITestHost:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: UITestSupport
        excludes:
          - Info.plist
    dependencies:
      - target: BriarContracts
      - target: BriarContractsMocks
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: [AppIconGray, AppIconPink, AppIconGreen]
        BRIAR_DISPLAY_NAME: Briar Native UI Tests
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev.ui-test-host
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) BRIAR_UI_TEST_SUPPORT
    entitlements:
      path: UITestSupport/BriarCompanion.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:briar-api.wbai.workers.dev
    info:
      path: UITestSupport/Info.plist
      properties:
        CFBundleDisplayName: $(BRIAR_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: app.briar.companion.authentication.ui-tests
            CFBundleURLSchemes:
              - briar-companion-ui-tests
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconGray:
              CFBundleIconName: AppIconGray
            AppIconPink:
              CFBundleIconName: AppIconPink
            AppIconGreen:
              CFBundleIconName: AppIconGreen
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
          CFBundleAlternateIcons:
            AppIconGray:
              CFBundleIconName: AppIconGray
            AppIconPink:
              CFBundleIconName: AppIconPink
            AppIconGreen:
              CFBundleIconName: AppIconGreen
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  BriarCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BriarCompanion
      - target: BriarContractsMocks
      - package: Connect
        product: Connect
      - package: SwiftProtobuf
        product: SwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev.tests
        GENERATE_INFOPLIST_FILE: true
  BriarCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: BriarCompanionUITestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.briar.companion.native.dev.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: BriarCompanionUITestHost
schemes:
  BriarCompanion-Dev:
    build:
      targets:
        BriarCompanion: all
        BriarCompanionTests: [test]
        BriarCompanionUITests: [test]
    run:
      config: Dev Debug
      environmentVariables:
        BRIAR_API_URL: http://127.0.0.1:8787
    test:
      config: Dev Debug
      gatherCoverageData: true
      targets:
        - name: BriarCompanionTests
          parallelizable: true
        - name: BriarCompanionUITests
          parallelizable: false
    profile:
      config: Dev Release
    analyze:
      config: Dev Debug
    archive:
      config: Dev Release
  BriarCompanion-Production:
    build:
      targets:
        BriarCompanion: all
    run:
      config: Production
    profile:
      config: Production
    analyze:
      config: Production
    archive:
      config: Production
