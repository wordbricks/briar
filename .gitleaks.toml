[extend]
useDefault = true

[[allowlists]]
description = "Cargo registry checksums are public package integrity hashes"
targetRules = ["generic-api-key"]
paths = ['''(^|/)(apps/briar/)?src-tauri/Cargo\.lock$''']

[[allowlists]]
description = "Apple App Store Connect issuer IDs are public release identifiers"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = ['''(^|/)config/release\.env$''']
regexes = ['''^APPLE_API_ISSUER=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']

[[allowlists]]
description = "Public Jay slot 10 campaign identifier in test fixtures and its audit documentation"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^apps/briar/worker/src/managed-computer-promotion-campaigns\.test\.ts$''',
  '''^docs/operations/security-exceptions\.md$''',
]
regexTarget = "secret"
regexes = ['''^getbriar-jay-10$''']

[[allowlists]]
description = "Claude Code's OAuth client identifier is public by design"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^apps/briar/src-cli/provider-credentials\.ts$''',
  '''^docs/operations/security-exceptions\.md$''',
]
regexTarget = "secret"
regexes = ['''^9d1c250a-e61b-44d9-88ed-5944d1962f5e$''']
