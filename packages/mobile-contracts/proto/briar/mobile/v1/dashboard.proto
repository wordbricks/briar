syntax = "proto3";

package briar.mobile.v1;

import "briar/mobile/v1/common.proto";
import "briar/mobile/v1/project.proto";
import "google/protobuf/timestamp.proto";

option swift_prefix = "BriarAPI_";

service DashboardService {
  rpc GetDashboard(GetDashboardRequest) returns (GetDashboardResponse);
  rpc SyncDashboard(SyncDashboardRequest) returns (SyncDashboardResponse);
  rpc ListRunEvents(ListRunEventsRequest) returns (ListRunEventsResponse);
}

message GetDashboardRequest {
  string project_id = 1;
}

message GetDashboardResponse {
  Project project = 1;
  repeated DashboardRun runs = 2;
  repeated DashboardWorker workers = 3;
  repeated AgentProvider organization_providers = 4;
  optional ProjectExecutionWorkerPolicy execution_policy = 5;
  repeated OrganizationMember members = 6;
  repeated ConversationNotification conversation_notifications = 7;
  repeated ChannelNotification channel_notifications = 8;
  uint64 cursor = 9;
  google.protobuf.Timestamp generated_at = 10;
}

message SyncDashboardRequest {
  string project_id = 1;
  uint64 cursor = 2;
}

message SyncDashboardResponse {
  uint64 cursor = 1;
  bool has_more = 2;
  bool reset = 3;
  repeated DashboardRun runs = 4;
  repeated string deleted_run_ids = 5;
  optional Project project = 6;
  repeated DashboardWorker workers = 7;
  repeated AgentProvider organization_providers = 8;
  optional ProjectExecutionWorkerPolicy execution_policy = 9;
  repeated OrganizationMember members = 10;
  repeated ConversationNotification conversation_notifications = 11;
  repeated ChannelNotification channel_notifications = 12;
  google.protobuf.Timestamp generated_at = 13;
}

message ListRunEventsRequest {
  string project_id = 1;
  string run_id = 2;
}

message ListRunEventsResponse {
  repeated RunEvent events = 1;
}

message WorkflowCheckpoint {
  enum Position {
    POSITION_UNSPECIFIED = 0;
    POSITION_BEFORE = 1;
    POSITION_AFTER = 2;
  }

  string key = 1;
  string stage = 2;
  string stage_label = 3;
  Position position = 4;
  uint32 attempt = 5;
  uint32 revision = 6;
  optional google.protobuf.Timestamp reached_at = 7;
  optional string next_stage = 8;
  optional string next_stage_label = 9;
  bool terminal_review_only = 10;
}

message WorkflowStage {
  string id = 1;
  string label = 2;
  bool required = 3;
}

message AutoHuntWorkflow {
  uint32 version = 1;
  repeated WorkflowStage stages = 2;
}

message IssueDependencyReference {
  string id = 1;
  uint32 run_number = 2;
  string title = 3;
  RunStatus status = 4;
}

message DashboardRun {
  enum ExecutionReadiness {
    EXECUTION_READINESS_UNSPECIFIED = 0;
    EXECUTION_READINESS_READY = 1;
    EXECUTION_READINESS_WAITING = 2;
  }

  enum DispatchMode {
    DISPATCH_MODE_UNSPECIFIED = 0;
    DISPATCH_MODE_ANY = 1;
    DISPATCH_MODE_SPECIFIC = 2;
  }

  string id = 1;
  optional uint32 run_number = 2;
  optional uint32 current_attempt = 3;
  optional uint32 current_revision = 4;
  optional string source_key = 5;
  optional google.protobuf.Timestamp source_created_at = 6;
  string title = 7;
  RunStatus status = 8;
  optional string workflow_stage = 9;
  optional AutoHuntWorkflow workflow = 10;
  optional google.protobuf.Timestamp paused_at = 11;
  optional google.protobuf.Timestamp resume_requested_at = 12;
  optional WorkflowCheckpoint checkpoint = 13;
  optional double progress = 14;
  optional string detail = 15;
  optional uint32 priority = 16;
  optional IssueDifficulty difficulty = 17;
  optional string assignee_user_id = 18;
  optional string created_by_user_id = 19;
  repeated IssueSubscriber subscribers = 20;
  optional string issue_description = 21;
  optional RelatedMessageReference related_message = 22;
  repeated IssueAttachment attachments = 23;
  repeated IssueDependencyReference prerequisites = 24;
  repeated IssueDependencyReference dependents = 25;
  optional ExecutionReadiness execution_readiness = 26;
  optional uint32 waiting_on_prerequisite_count = 27;
  optional string result_summary = 28;
  optional StructuredRunResult structured_result = 29;
  repeated ResultReview result_reviews = 30;
  repeated string pull_request_urls = 31;
  optional string branch = 32;
  optional string commit_sha = 33;
  optional AgentProvider preferred_provider = 34;
  optional string preferred_model = 35;
  optional string preferred_effort = 36;
  optional bool full_auto = 37;
  optional AgentProvider requested_provider = 38;
  optional string requested_model = 39;
  optional string requested_effort = 40;
  optional string requested_worker_id = 41;
  optional string requested_by_user_id = 42;
  optional DispatchMode dispatch_mode = 43;
  optional google.protobuf.Timestamp dispatched_at = 44;
  optional string claimed_by = 45;
  optional google.protobuf.Timestamp claimed_at = 46;
  optional string worker_id = 47;
  optional google.protobuf.Timestamp started_at = 48;
  google.protobuf.Timestamp updated_at = 49;
  optional google.protobuf.Timestamp completed_at = 50;
  optional google.protobuf.Timestamp last_event_at = 51;
  optional uint32 event_count = 52;
}

message WorkerIcon {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_EMOJI = 1;
    KIND_IMAGE = 2;
  }

  Kind kind = 1;
  string value = 2;
}

message DashboardWorker {
  string id = 1;
  string label = 2;
  optional WorkerIcon icon = 3;
  optional AgentProvider agent_provider = 4;
  repeated AgentProvider providers = 5;
  optional ProviderCapabilities capabilities = 6;
  string readiness = 7;
  bool accepting_work = 8;
  optional string readiness_detail = 9;
  uint32 active_sessions = 10;
  uint32 available_sessions = 11;
}

message ProjectExecutionWorkerPolicy {
  enum SelectionMode {
    SELECTION_MODE_UNSPECIFIED = 0;
    SELECTION_MODE_ANY = 1;
    SELECTION_MODE_ALLOWLIST = 2;
  }

  SelectionMode selection_mode = 1;
  optional string default_worker_id = 2;
  repeated string allowed_worker_ids = 3;
  optional google.protobuf.Timestamp updated_at = 4;
}

message ConversationNotification {
  string id = 1;
  string run_id = 2;
  string run_title = 3;
  string root_message_id = 4;
  string body = 5;
  repeated MessageBlock blocks = 6;
  MessageAuthor author = 7;
  NotificationReason reason = 8;
  google.protobuf.Timestamp created_at = 9;
}

message ChannelNotification {
  string id = 1;
  string channel_id = 2;
  string channel_name = 3;
  string root_message_id = 4;
  string body = 5;
  MessageAuthor author = 6;
  NotificationReason reason = 7;
  google.protobuf.Timestamp created_at = 8;
}

message RunEvent {
  string id = 1;
  RunStatus status = 2;
  optional string workflow_stage = 3;
  optional string detail = 4;
  string actor = 5;
  optional string actor_name = 6;
  google.protobuf.Timestamp occurred_at = 7;
}
