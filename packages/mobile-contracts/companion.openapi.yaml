                  "string",
                  "null"
                ],
                "maxLength": 100000
              },
              "priority": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 1,
                "maximum": 4
              },
              "status": {
                "type": "string",
                "description": "Legacy stored proposals may read as queued; accepting either value always creates a backlog issue and never starts execution.",
                "enum": [
                  "backlog",
                  "queued"
                ]
              }
            },
            "additionalProperties": false
          },
