        "description": "Request failed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "parameters": {
      "ProjectId": {
        "name": "projectId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "RunId": {
        "name": "runId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "OrganizationId": {
        "name": "organizationId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "ChannelId": {
        "name": "channelId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "schemas": {
      "InboxFeedResponse": {
        "type": "object",
        "required": [
          "messages",
          "subscribedIssueIds",
          "generatedAt"
        ],
        "properties": {
          "messages": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/InboxFeedMessage"
            }
          },
          "subscribedIssueIds": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "generatedAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "additionalProperties": false
      },
      "InboxFeedMessage": {
        "type": "object",
        "required": [
          "id",
          "kind",
          "projectId",
          "projectName",
          "targetId",
          "title",
          "occurredAt",
          "version"
        ],
        "properties": {
          "id": { "type": "string" },
          "kind": {
            "type": "string",
            "enum": ["issue", "conversation", "channel", "session"]
          },
          "projectId": { "type": "string", "format": "uuid" },
          "projectName": { "type": "string" },
          "targetId": { "type": "string" },
          "title": { "type": "string" },
          "occurredAt": { "type": "string", "format": "date-time" },
          "version": { "type": "string" },
          "runNumber": { "type": "integer", "minimum": 1 },
          "status": {
            "type": "string",
            "enum": ["paused", "completed", "failed", "blocked"]
          },
          "workflowStage": { "type": ["string", "null"] },
          "workflowStageLabel": { "type": ["string", "null"] },
          "priority": { "type": ["integer", "null"], "minimum": 1, "maximum": 4 },
          "structuredResult": {
            "type": ["object", "null"],
            "additionalProperties": true
          },
          "messageId": { "type": "string", "format": "uuid" },
          "rootMessageId": { "type": "string", "format": "uuid" },
          "body": { "type": "string" },
          "authorName": { "type": "string" },
          "authorImage": { "type": ["string", "null"] },
          "issueKey": { "type": "string" },
          "reason": {
            "type": "string",
            "enum": ["mention", "thread_reply", "subscription"]
          },
          "channelId": { "type": "string", "format": "uuid" },
          "channelName": { "type": "string" },
          "agentName": { "type": ["string", "null"] },
          "issueCount": { "type": "integer", "minimum": 0 },
          "error": { "type": ["string", "null"] },
          "summary": { "type": ["string", "null"] },
          "requiresAttention": { "type": "boolean" }
        },
        "additionalProperties": false
      },
      "InboxReadStates": {
        "type": "object",
        "required": [
          "readVersions"
        ],
        "properties": {
          "readVersions": {
            "type": "object",
            "additionalProperties": {
              "type": "string"
            }
          },
          "agentReplies": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/IssueAgentReply"
            }
          }
        },
