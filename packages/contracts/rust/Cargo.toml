[package]
name = "briar-contracts"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = []
client = ["connectrpc/client"]

[dependencies]
buffa = { version = "=0.9.1", features = ["json"] }
buffa-types = { version = "=0.9.1", features = ["json"] }
connectrpc = { version = "=0.9.0", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
