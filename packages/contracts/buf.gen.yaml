version: v2
clean: true
plugins:
  - remote: buf.build/bufbuild/es:v2.14.0
    out: packages/contracts/src/gen
    opt:
      - target=ts
  - remote: buf.build/apple/swift:v1.38.1
    out: apps/briar/ios/BriarCompanion/App/Generated/Connect
    types:
      - briar.app.v1
      - briar.realtime.v1
      - briar.types.v1
    opt:
      - Visibility=Internal
  - remote: buf.build/connectrpc/swift:v1.2.3
    out: apps/briar/ios/BriarCompanion/App/Generated/Connect
    types:
      - briar.app.v1
    opt:
      - Visibility=Internal
      - GenerateAsyncMethods=true
      - GenerateCallbackMethods=false
  - remote: buf.build/anthropics/buffa:v0.9.1
    out: packages/contracts/rust/src/gen/proto
    opt:
      - file_per_package=true
      - views=true
      - json=true
  - remote: buf.build/connectrpc/rust:v0.9.0
    out: packages/contracts/rust/src/gen/connect
    types:
      - briar.app.v1
    opt:
      - file_per_package
      - buffa_module=crate::proto
      - gate_client_feature=client
