  optional google.protobuf.Timestamp organization_context_snapshot_at = 19;
  optional ClaimedChannelDelegation delegation = 20;
  repeated ChannelDelegationTarget delegation_targets = 21;
  optional ChannelReplySession session = 22;
  optional ClaimedHandoffContext handoff_context = 23;
