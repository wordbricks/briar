  string run_id = 4;
  string source_key = 5;
  string title = 6;
  string trigger_message_id = 7;
  string parent_message_id = 8;
  briar.types.v1.AgentProvider provider = 9;
  optional string model = 10;
  optional string effort = 11;
  DetachedAgentClaim agent = 12;
  optional DetachedAgentSkill active_skill = 13;
  optional DetachedAgentSkillExecutionTarget skill_execution_target = 14;
  string claim_token = 15;
  google.protobuf.Timestamp claimed_at = 16;
  google.protobuf.Timestamp lease_expires_at = 17;
