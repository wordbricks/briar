// Secret-free durable issue snapshot shared by the Worker RPC claim and local
// CLI ProtoJSON output. Attachments are wrapped separately because local
// allocation adds a downloaded path or error to each attachment.
message ClaimedIssuePayload {
  string execution_id = 1;
  string run_id = 2;
  uint32 run_number = 3;
  uint32 current_attempt = 4;
  uint32 current_revision = 5;
  AutoHuntSource source = 6;
  string source_key = 7;
  string title = 8;
  optional string description = 9;
  optional uint32 priority = 10;
  string repository = 11;
  optional google.protobuf.Timestamp source_created_at = 12;
  optional string created_by_user_id = 13;
  optional google.protobuf.Struct context = 14;
  optional string review_feedback = 15;
  briar.types.v1.AutoHuntWorkflow workflow = 16;
  optional string workflow_stage = 17;
  optional string start_stage = 18;
  optional ResumeContext resume_context = 19;
  repeated QueuedIssueMessage messages = 20;
  string claimed_by = 21;
  google.protobuf.Timestamp claimed_at = 22;
  google.protobuf.Timestamp lease_expires_at = 23;
  uint32 claim_attempts = 24;
  optional DetachedExecution execution = 25;
}

message ClaimedIssue {
  ClaimedIssuePayload payload = 1;
  repeated QueuedAttachment attachments = 2;
  string claim_token = 3;
  optional ClaimedHandoffContext handoff_context = 4;
  optional DetachedAgentClaim agent = 5;
  optional DetachedAgentSkill active_skill = 6;
}

