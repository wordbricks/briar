syntax = "proto3";

package briar.worker.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Claim-scoped, lazily hydrated context for Workspace Agents. The Worker
// credential authenticates the machine; the claim capability in each request
// authorizes one active channel reply.
service WorkspaceAgentContextService {
  rpc GetManifest(WorkspaceAgentContextServiceGetManifestRequest) returns (WorkspaceAgentContextServiceGetManifestResponse);
  rpc Lookup(WorkspaceAgentContextServiceLookupRequest) returns (WorkspaceAgentContextServiceLookupResponse);
}

message WorkspaceAgentContextClaim {
  string workspace_id = 1;
  string work_id = 2;
  string worker_id = 3;
  string claim_token = 4;
}

message WorkspaceAgentContextServiceGetManifestRequest {
  WorkspaceAgentContextClaim claim = 1;
  optional string known_revision = 2;
}

message WorkspaceAgentContextServiceGetManifestResponse {
  oneof result {
    WorkspaceAgentContextManifest manifest = 1;
    WorkspaceAgentContextManifestUnchanged unchanged = 2;
  }
}

message WorkspaceAgentContextManifestUnchanged {
  string workspace_id = 1;
  string work_id = 2;
  google.protobuf.Timestamp snapshot_at = 3;
  string revision = 4;
}

message WorkspaceAgentContextManifest {
  string workspace_id = 1;
  string work_id = 2;
  google.protobuf.Timestamp snapshot_at = 3;
  string revision = 4;
  repeated WorkspaceAgentContextManifestProject projects = 5;
}

message WorkspaceAgentContextManifestProject {
  string id = 1;
  string name = 2;
  string issue_key_prefix = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  optional google.protobuf.Timestamp settings_revision = 6;
  WorkspaceAgentContextResourceRevision agents = 7;
  WorkspaceAgentContextIssueRevision issues = 8;
  WorkspaceAgentContextSessionRevision sessions = 9;
}

message WorkspaceAgentContextResourceRevision {
  uint32 count = 1;
  optional google.protobuf.Timestamp revision = 2;
}

message WorkspaceAgentContextIssueRevision {
  uint32 count = 1;
  uint32 open_count = 2;
  uint32 pull_request_count = 3;
  optional google.protobuf.Timestamp revision = 4;
}

message WorkspaceAgentContextSessionRevision {
  uint32 count = 1;
  uint32 archived_count = 2;
  optional google.protobuf.Timestamp revision = 3;
}

message WorkspaceAgentContextServiceLookupRequest {
  WorkspaceAgentContextClaim claim = 1;
  repeated WorkspaceAgentContextLookup queries = 2;
  string request_id = 3;
}

message WorkspaceAgentContextLookup {
  oneof query {
    WorkspaceAgentContextProjectLookup project_settings = 1;
    WorkspaceAgentContextSummaryLookup agent_summaries = 2;
    WorkspaceAgentContextDetailLookup agent_details = 3;
    WorkspaceAgentContextSummaryLookup issue_summaries = 4;
    WorkspaceAgentContextDetailLookup issue_details = 5;
    WorkspaceAgentContextSummaryLookup session_summaries = 6;
    WorkspaceAgentContextDetailLookup session_details = 7;
    WorkspaceAgentContextDetailLookup skills = 8;
    WorkspaceAgentContextPullRequestLookup issue_pull_requests = 9;
  }
}

message WorkspaceAgentContextProjectLookup {
  string project_id = 1;
}

message WorkspaceAgentContextSummaryLookup {
  string project_id = 1;
  uint32 limit = 2;
  optional string cursor = 3;
}

message WorkspaceAgentContextDetailLookup {
  string project_id = 1;
  repeated string ids = 2;
}

message WorkspaceAgentContextPullRequestLookup {
  string project_id = 1;
  repeated string issue_ids = 2;
}

message WorkspaceAgentContextServiceLookupResponse {
  string workspace_id = 1;
  string work_id = 2;
  google.protobuf.Timestamp snapshot_at = 3;
  repeated WorkspaceAgentContextLookupResult results = 4;
}

message WorkspaceAgentContextLookupResult {
  WorkspaceAgentContextLookup query = 1;

  // Lookup payloads are written verbatim into LLM-facing context files. Their
  // resource-specific domain shapes intentionally remain an extensible JSON
  // value; the request, scope, ordering, and transport envelope are canonical.
  google.protobuf.Value data = 2;
}
