syntax = "proto3";

package briar.app.v1;

import "briar/types/v1/provider.proto";
import "google/protobuf/timestamp.proto";

option swift_prefix = "BriarAPI_";

// UUID values are carried as canonical lowercase strings at the wire boundary.
enum ProjectRole {
  PROJECT_ROLE_UNSPECIFIED = 0;
  PROJECT_ROLE_OWNER = 1;
  PROJECT_ROLE_CO_OWNER = 2;
  PROJECT_ROLE_DEVELOPER = 3;
  PROJECT_ROLE_EDITOR = 4;
  PROJECT_ROLE_VIEWER = 5;
}

enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_BACKLOG = 1;
  RUN_STATUS_QUEUED = 2;
  RUN_STATUS_RUNNING = 3;
  RUN_STATUS_PAUSED = 4;
  RUN_STATUS_BLOCKED = 5;
  RUN_STATUS_FAILED = 6;
  RUN_STATUS_COMPLETED = 7;
  RUN_STATUS_CANCELLED = 8;
}

enum IssueDifficulty {
  ISSUE_DIFFICULTY_UNSPECIFIED = 0;
  ISSUE_DIFFICULTY_EASY = 1;
  ISSUE_DIFFICULTY_NORMAL = 2;
  ISSUE_DIFFICULTY_HARD = 3;
}

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  PROPOSAL_STATUS_PENDING = 1;
  PROPOSAL_STATUS_ACCEPTED = 2;
  PROPOSAL_STATUS_DECLINED = 3;
}

enum ApprovalOutcome {
  APPROVAL_OUTCOME_UNSPECIFIED = 0;
  APPROVAL_OUTCOME_ACCEPTED = 1;
  APPROVAL_OUTCOME_ALREADY_ACCEPTED = 2;
}

enum ReplyJobStatus {
  REPLY_JOB_STATUS_UNSPECIFIED = 0;
  REPLY_JOB_STATUS_QUEUED = 1;
  REPLY_JOB_STATUS_RUNNING = 2;
  REPLY_JOB_STATUS_COMPLETED = 3;
  REPLY_JOB_STATUS_FAILED = 4;
}

enum NotificationReason {
  NOTIFICATION_REASON_UNSPECIFIED = 0;
  NOTIFICATION_REASON_MENTION = 1;
  NOTIFICATION_REASON_THREAD_REPLY = 2;
  NOTIFICATION_REASON_SUBSCRIPTION = 3;
}

message User {
  string id = 1;
  optional string username = 2;
  string name = 3;
  string email = 4;
  optional string image = 5;
}

message OrganizationMember {
  string user_id = 1;
  string name = 2;
  string email = 3;
  optional string image = 4;
  ProjectRole role = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated string project_ids = 7;
}

message IssueSubscriber {
  string user_id = 1;
  google.protobuf.Timestamp subscribed_at = 2;
}

message IssueAttachment {
  string id = 1;
  string filename = 2;
  string content_type = 3;
  uint64 byte_size = 4;
  string url = 5;
}

message MessageAuthor {
  optional string id = 1;
  optional string agent_id = 2;
  string name = 3;
  optional string image = 4;
  optional briar.types.v1.AgentProvider provider = 5;
}

message RelatedMessageReference {
  string organization_id = 1;
  string channel_id = 2;
  string message_id = 3;
  string root_message_id = 4;
}

message StructuredRunResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_COMPLETED = 1;
    OUTCOME_PARTIAL = 2;
    OUTCOME_BLOCKED = 3;
    OUTCOME_FAILED = 4;
  }

  enum Importance {
    IMPORTANCE_UNSPECIFIED = 0;
    IMPORTANCE_ROUTINE = 1;
    IMPORTANCE_IMPORTANT = 2;
    IMPORTANCE_CRITICAL = 3;
  }

  enum Urgency {
    URGENCY_UNSPECIFIED = 0;
    URGENCY_NORMAL = 1;
    URGENCY_TIME_SENSITIVE = 2;
    URGENCY_IMMEDIATE = 3;
  }

  enum Impact {
    IMPACT_UNSPECIFIED = 0;
    IMPACT_ISSUE = 1;
    IMPACT_PROJECT = 2;
    IMPACT_ORGANIZATION = 3;
  }

  string summary = 1;
  Outcome outcome = 2;
  Importance importance = 3;
  Urgency urgency = 4;
  Impact impact = 5;
  bool human_action_required = 6;
  optional string next_action = 7;
  optional google.protobuf.Timestamp due_at = 8;
}

message ResultReview {
  string user_id = 1;
  string name = 2;
  optional string username = 3;
  optional string image = 4;
  google.protobuf.Timestamp completed_at = 5;
}

message BlockText {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_PLAIN_TEXT = 1;
    KIND_MARKDOWN = 2;
  }

  Kind kind = 1;
  string text = 2;
  optional bool emoji = 3;
  optional bool verbatim = 4;
}

message RichTextStyle {
  optional bool bold = 1;
  optional bool italic = 2;
  optional bool strike = 3;
  optional bool code = 4;
}

message RichTextInline {
  message Text {
    string text = 1;
    optional RichTextStyle style = 2;
  }

  message Link {
    string url = 1;
    optional string text = 2;
    optional RichTextStyle style = 3;
  }

  message Emoji {
    string name = 1;
  }

  oneof value {
    Text text = 1;
    Link link = 2;
    Emoji emoji = 3;
  }
}

message RichTextSection {
  repeated RichTextInline elements = 1;
}

message RichTextElement {
  message List {
    enum Style {
      STYLE_UNSPECIFIED = 0;
      STYLE_BULLET = 1;
      STYLE_ORDERED = 2;
    }

    Style style = 1;
    optional uint32 indent = 2;
    optional uint32 offset = 3;
    repeated RichTextSection elements = 4;
  }

  message Quote {
    repeated RichTextInline elements = 1;
  }

  message Preformatted {
    repeated RichTextInline elements = 1;
  }

  oneof value {
    RichTextSection section = 1;
    List list = 2;
    Quote quote = 3;
    Preformatted preformatted = 4;
  }
}

message MessageBlock {
  message Header {
    BlockText text = 1;
    optional string block_id = 2;
  }

  message Section {
    BlockText text = 1;
    optional string block_id = 2;
    optional bool expand = 3;
  }

  message Markdown {
    string text = 1;
    optional string block_id = 2;
  }

  message Divider {
    optional string block_id = 1;
  }

  message Context {
    repeated BlockText elements = 1;
    optional string block_id = 2;
  }

  message RichText {
    repeated RichTextElement elements = 1;
    optional string block_id = 2;
  }

  oneof value {
    Header header = 1;
    Section section = 2;
    Markdown markdown = 3;
    Divider divider = 4;
    Context context = 5;
    RichText rich_text = 6;
  }
}
