syntax = "proto3";

package briar.app.v1;

import "google/protobuf/timestamp.proto";

option swift_prefix = "BriarAPI_";

service DmMemoryService {
  rpc ListDmMemories(ListDmMemoriesRequest) returns (ListDmMemoriesResponse);
  rpc GetDmMemoryDocument(GetDmMemoryDocumentRequest) returns (GetDmMemoryDocumentResponse);
  rpc ListDmMemoryRevisions(ListDmMemoryRevisionsRequest) returns (ListDmMemoryRevisionsResponse);
  rpc CreateDmMemoryDocument(CreateDmMemoryDocumentRequest) returns (CreateDmMemoryDocumentResponse);
  rpc UpdateDmMemoryDocument(UpdateDmMemoryDocumentRequest) returns (UpdateDmMemoryDocumentResponse);
  rpc DeleteDmMemoryDocument(DeleteDmMemoryDocumentRequest) returns (DeleteDmMemoryDocumentResponse);
  rpc UpdateDmMemorySettings(UpdateDmMemorySettingsRequest) returns (UpdateDmMemorySettingsResponse);
  rpc RetryDmMemoryLearning(RetryDmMemoryLearningRequest) returns (RetryDmMemoryLearningResponse);
}

message ListDmMemoriesRequest {
  string organization_id = 1;
  string channel_id = 2;
  optional string memory_space_id = 3;
  optional string cursor = 4;
}

message ListDmMemoriesResponse {
  bool eligible = 1;
  DmMemoryCapabilities capabilities = 2;
  repeated DmMemorySpace spaces = 3;
  optional string selected_space_id = 4;
  repeated DmMemoryDocument documents = 5;
  optional string next_cursor = 6;
  optional DmMemoryLearningStatus learning = 7;
}

message DmMemoryLearningStatus {
  optional DmMemoryLearningConfiguration configuration = 1;
  uint32 calls_today = 2;
  uint64 reserved_micro_usd_today = 3;
  uint32 pending_jobs = 4;
  uint32 failed_jobs = 5;
  optional DmMemoryLearningJob last_job = 6;
  optional DmMemoryLearningRetryableJob retryable_job = 7;
}

message DmMemoryLearningConfiguration {
  DmMemoryLearningModel proposer = 1;
  DmMemoryLearningModel verifier = 2;
  uint32 space_daily_calls = 3;
  uint64 space_daily_micro_usd = 4;
}

message DmMemoryLearningModel {
  string model = 1;
  string provider = 2;
}

message DmMemoryLearningJob {
  string id = 1;
  DmMemoryLearningJobKind kind = 2;
  DmMemoryLearningJobStatus status = 3;
  optional DmMemoryLearningJobStage stage = 4;
  optional DmMemoryLearningFailureCode error_code = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message DmMemoryLearningRetryableJob {
  string id = 1;
  uint32 calls_used = 2;
}

message RetryDmMemoryLearningRequest {
  string organization_id = 1;
  string channel_id = 2;
  string job_id = 3;
  string request_id = 4;
  uint64 revocation_epoch = 5;
}

message RetryDmMemoryLearningResponse {
  bool accepted = 1;
  bool replayed = 2;
}

enum DmMemoryLearningJobKind {
  DM_MEMORY_LEARNING_JOB_KIND_UNSPECIFIED = 0;
  DM_MEMORY_LEARNING_JOB_KIND_EXTRACT = 1;
  DM_MEMORY_LEARNING_JOB_KIND_EXPLICIT_REQUEST = 2;
  DM_MEMORY_LEARNING_JOB_KIND_CONSOLIDATE = 3;
}

enum DmMemoryLearningJobStatus {
  DM_MEMORY_LEARNING_JOB_STATUS_UNSPECIFIED = 0;
  DM_MEMORY_LEARNING_JOB_STATUS_PENDING = 1;
  DM_MEMORY_LEARNING_JOB_STATUS_RUNNING = 2;
  DM_MEMORY_LEARNING_JOB_STATUS_RETRY_WAIT = 3;
  DM_MEMORY_LEARNING_JOB_STATUS_FAILED = 4;
  DM_MEMORY_LEARNING_JOB_STATUS_CANCELLED = 5;
  DM_MEMORY_LEARNING_JOB_STATUS_SUCCEEDED = 6;
  DM_MEMORY_LEARNING_JOB_STATUS_NO_CHANGE = 7;
}

enum DmMemoryLearningJobStage {
  DM_MEMORY_LEARNING_JOB_STAGE_UNSPECIFIED = 0;
  DM_MEMORY_LEARNING_JOB_STAGE_PROPOSING = 1;
  DM_MEMORY_LEARNING_JOB_STAGE_VERIFYING = 2;
  DM_MEMORY_LEARNING_JOB_STAGE_COMMITTING = 3;
}

enum DmMemoryLearningFailureCode {
  DM_MEMORY_LEARNING_FAILURE_CODE_UNSPECIFIED = 0;
  DM_MEMORY_LEARNING_FAILURE_CODE_INVALID_PROPOSAL = 1;
  DM_MEMORY_LEARNING_FAILURE_CODE_VERIFICATION_REJECTED = 2;
  DM_MEMORY_LEARNING_FAILURE_CODE_STALE = 3;
  DM_MEMORY_LEARNING_FAILURE_CODE_SCOPE_REVOKED = 4;
  DM_MEMORY_LEARNING_FAILURE_CODE_BUDGET_EXHAUSTED = 5;
  DM_MEMORY_LEARNING_FAILURE_CODE_MODEL_UNAVAILABLE = 6;
  DM_MEMORY_LEARNING_FAILURE_CODE_MODEL_TIMEOUT = 7;
  DM_MEMORY_LEARNING_FAILURE_CODE_MODEL_CREDENTIALS = 8;
  DM_MEMORY_LEARNING_FAILURE_CODE_MODEL_CONFIGURATION = 9;
  DM_MEMORY_LEARNING_FAILURE_CODE_INPUT_CAPACITY = 10;
}

message GetDmMemoryDocumentRequest {
  string organization_id = 1;
  string channel_id = 2;
  string document_id = 3;
  optional uint32 version = 4;
}

message GetDmMemoryDocumentResponse {
  DmMemoryDocument document = 1;
}

message ListDmMemoryRevisionsRequest {
  string organization_id = 1;
  string channel_id = 2;
  string document_id = 3;
  optional uint32 cursor = 4;
}

message ListDmMemoryRevisionsResponse {
  string document_id = 1;
  uint32 current_version = 2;
  repeated DmMemoryRevision revisions = 3;
  optional uint32 next_cursor = 4;
}

message DmMemoryRevision {
  uint32 version = 1;
  google.protobuf.Timestamp created_at = 2;
  DmMemoryClass memory_class = 3;
  bool protected_by_user = 4;
  optional google.protobuf.Timestamp valid_until = 5;
  DmMemoryRevisionOrigin origin = 6;
}

message CreateDmMemoryDocumentRequest {
  string organization_id = 1;
  string channel_id = 2;
  string request_id = 3;
  optional string memory_space_id = 4;
  string title = 5;
  string body = 6;
  DmMemoryClass memory_class = 7;
  string source_language = 8;
  optional google.protobuf.Timestamp observed_at = 9;
  optional google.protobuf.Timestamp valid_until = 10;
  optional DmMemorySourceMessage source_message = 11;
}

message UpdateDmMemoryDocumentRequest {
  string organization_id = 1;
  string channel_id = 2;
  string document_id = 3;
  string request_id = 4;
  optional string memory_space_id = 5;
  uint32 expected_version = 6;
  string title = 7;
  string body = 8;
  DmMemoryClass memory_class = 9;
  string source_language = 10;
  optional google.protobuf.Timestamp observed_at = 11;
  optional google.protobuf.Timestamp valid_until = 12;
  optional DmMemorySourceMessage source_message = 13;
}

message CreateDmMemoryDocumentResponse {
  string document_id = 1;
  uint32 version = 2;
  bool replayed = 3;
}

message UpdateDmMemoryDocumentResponse {
  string document_id = 1;
  uint32 version = 2;
  bool replayed = 3;
}

message DeleteDmMemoryDocumentRequest {
  string organization_id = 1;
  string channel_id = 2;
  string document_id = 3;
}

message DeleteDmMemoryDocumentResponse {
  bool deleted = 1;
  string purge_state = 2;
}

message UpdateDmMemorySettingsRequest {
  string organization_id = 1;
  string channel_id = 2;
  string request_id = 3;
  optional string memory_space_id = 4;
  uint64 expected_memory_revision = 5;
  bool use_enabled = 6;
  bool auto_enabled = 7;
}

message UpdateDmMemorySettingsResponse {
  DmMemorySpace space = 1;
}

message DmMemoryCapabilities {
  bool recall = 1;
  bool automatic_learning = 2;
}

message DmMemorySpace {
  string id = 1;
  string channel_id = 2;
  string agent_id = 3;
  uint64 roster_epoch = 4;
  DmMemorySpaceStatus status = 5;
  bool use_enabled = 6;
  bool auto_enabled = 7;
  uint64 memory_revision = 8;
  uint64 revocation_epoch = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message DmMemoryDocument {
  string id = 1;
  string memory_space_id = 2;
  DmMemoryDocumentKind kind = 3;
  string title = 4;
  uint32 version = 5;
  DmMemoryDocumentStatus status = 6;
  bool conflicted = 7;
  DmMemoryClass memory_class = 8;
  DmMemoryEvidenceType evidence_type = 9;
  bool protected_by_user = 10;
  string source_language = 11;
  optional google.protobuf.Timestamp observed_at = 12;
  optional google.protobuf.Timestamp valid_until = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
  DmMemoryIndexState index_state = 16;
  optional string body = 17;
  repeated DmMemorySource sources = 18;
}

message DmMemorySourceMessage {
  string id = 1;
  uint32 version = 2;
}

message DmMemorySource {
  DmMemorySourceType type = 1;
  string id = 2;
  uint32 version = 3;
}

message DmMemoryReference {
  string document_id = 1;
  uint32 version = 2;
}

message DmMemoryDescriptor {
  uint32 protocol = 1;
  string memory_space_id = 2;
  uint64 memory_revision = 3;
  uint64 revocation_epoch = 4;
  bool search_enabled = 5;
  DmMemoryBriefState brief_state = 6;
}

enum DmMemoryClass {
  DM_MEMORY_CLASS_UNSPECIFIED = 0;
  DM_MEMORY_CLASS_PROFILE = 1;
  DM_MEMORY_CLASS_LOG = 2;
  DM_MEMORY_CLASS_NOTE = 3;
}

enum DmMemorySpaceStatus {
  DM_MEMORY_SPACE_STATUS_UNSPECIFIED = 0;
  DM_MEMORY_SPACE_STATUS_ACTIVE = 1;
  DM_MEMORY_SPACE_STATUS_CLOSED = 2;
}

enum DmMemoryDocumentKind {
  DM_MEMORY_DOCUMENT_KIND_UNSPECIFIED = 0;
  DM_MEMORY_DOCUMENT_KIND_OBSERVATION = 1;
  DM_MEMORY_DOCUMENT_KIND_TOPIC = 2;
}

enum DmMemoryDocumentStatus {
  DM_MEMORY_DOCUMENT_STATUS_UNSPECIFIED = 0;
  DM_MEMORY_DOCUMENT_STATUS_ACTIVE = 1;
  DM_MEMORY_DOCUMENT_STATUS_INVALIDATED = 2;
  DM_MEMORY_DOCUMENT_STATUS_SUPERSEDED = 3;
}

enum DmMemoryEvidenceType {
  DM_MEMORY_EVIDENCE_TYPE_UNSPECIFIED = 0;
  DM_MEMORY_EVIDENCE_TYPE_EXPLICIT_USER = 1;
  DM_MEMORY_EVIDENCE_TYPE_OBSERVED = 2;
}

enum DmMemoryIndexState {
  DM_MEMORY_INDEX_STATE_UNSPECIFIED = 0;
  DM_MEMORY_INDEX_STATE_PENDING = 1;
  DM_MEMORY_INDEX_STATE_READY = 2;
  DM_MEMORY_INDEX_STATE_FAILED = 3;
}

enum DmMemorySourceType {
  DM_MEMORY_SOURCE_TYPE_UNSPECIFIED = 0;
  DM_MEMORY_SOURCE_TYPE_MESSAGE = 1;
  DM_MEMORY_SOURCE_TYPE_USER_EDIT_EVENT = 2;
}

enum DmMemoryRevisionOrigin {
  DM_MEMORY_REVISION_ORIGIN_UNSPECIFIED = 0;
  DM_MEMORY_REVISION_ORIGIN_USER_EDIT = 1;
  DM_MEMORY_REVISION_ORIGIN_EXPLICIT_REQUEST = 2;
  DM_MEMORY_REVISION_ORIGIN_EXTRACT = 3;
  DM_MEMORY_REVISION_ORIGIN_CONSOLIDATE = 4;
}

enum DmMemoryBriefState {
  DM_MEMORY_BRIEF_STATE_UNSPECIFIED = 0;
  DM_MEMORY_BRIEF_STATE_AVAILABLE = 1;
  DM_MEMORY_BRIEF_STATE_DISABLED = 2;
}
