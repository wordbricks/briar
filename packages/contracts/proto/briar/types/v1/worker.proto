syntax = "proto3";

package briar.types.v1;

import "briar/types/v1/provider.proto";

option swift_prefix = "BriarTypes_";

message AgentEffortCapability {
  string id = 1;
  string label = 2;
  optional string description = 3;
  optional bool is_default = 4;
}

message AgentModelCapability {
  string id = 1;
  string label = 2;
  optional bool is_default = 3;
  optional string default_effort_id = 4;
  repeated AgentEffortCapability efforts = 5;
}

message AgentProviderCapability {
  AgentProvider provider = 1;
  repeated AgentModelCapability models = 2;
  repeated AgentEffortCapability default_efforts = 3;
  optional bool allow_custom_models = 4;
  optional string error = 5;
}

message RemoteUpdateCapability {
  bool supported = 1;
  optional uint32 protocol = 2;
}

message WorkerCapabilities {
  repeated AgentProviderCapability provider_capabilities = 1;
  optional RemoteUpdateCapability remote_updates = 2;
}
