syntax = "proto3";

package briar.types.v1;

import "briar/types/v1/provider.proto";
import "briar/types/v1/computer_use.proto";

option swift_prefix = "BriarTypes_";

message AgentEffortCapability {
  string id = 1;
  string label = 2;
  optional string description = 3;
  optional bool is_default = 4;
}

message AgentModelCapability {
  string id = 1;
  string label = 2;
  optional bool is_default = 3;
  optional string default_effort_id = 4;
  repeated AgentEffortCapability efforts = 5;
}

message AgentProviderCapability {
  AgentProvider provider = 1;
  repeated AgentModelCapability models = 2;
  repeated AgentEffortCapability default_efforts = 3;
  bool allow_custom_models = 4;
  optional string error = 5;
}

message RemoteUpdateCapability {
  bool supported = 1;
  // 1: desktop/managed release. 2: sandbox runtime and provider updates.
  optional uint32 protocol = 2;
}

message AgentProviderHealth {
  AgentProvider provider = 1;
  bool installed = 2;
  bool authenticated = 3;
  bool healthy = 4;
  optional string reason = 5;
  bool usage_exhausted = 6;
  optional double max_used_percent = 7;
}

message WorkflowRequirementHealth {
  string id = 1;
  bool healthy = 2;
  optional string detail = 3;
}

message WorkerCapabilities {
  repeated AgentProviderCapability provider_capabilities = 1;
  optional RemoteUpdateCapability remote_updates = 2;
  bool worktrees = 3;
  reserved 4;
  reserved "organization_agent_context_protocol";
  repeated WorkflowRequirementHealth workflow_requirements = 5;
  // Legacy D1 memory protocol and learning; older Workers may still send them.
  reserved 6, 7, 8;
  reserved "dm_memory_protocol", "dm_memory_learning_requests", "dm_memory_learning";
  optional ComputerUseCapability computer_use = 9;
  optional DmPublicMessageCapability dm_public_messages = 10;
  optional DmPublicMessageCapability dm_reply_routing = 11;
  // Memory vault tools (`tools memory …`) and per-turn vault context
  // (docs/plans/memory-vault-spec.md). Absence and zero mean the Worker CLI
  // predates the vault and gets no memory.
  optional uint32 memory_vault_protocol = 12;
}

// Public DM output is negotiated independently from memory and computer use.
// Absence and protocol zero mean that the Worker must use the legacy single
// completion message.
message DmPublicMessageCapability {
  uint32 protocol = 1;
  repeated AgentProvider providers = 2;
}

message WorkerRuntimeAdvertisement {
  AgentProvider agent_provider = 1;
  reserved 2;
  reserved "providers";
  repeated AgentProviderHealth provider_health = 3;
  WorkerCapabilities capabilities = 4;
  map<string, string> versions = 5;
  // Set only by a worker started from a staged sandbox runtime.
  optional string update_request_id = 6;
}
