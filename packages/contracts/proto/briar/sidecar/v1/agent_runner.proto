syntax = "proto3";

package briar.sidecar.v1;

import "briar/app/v1/channel.proto";
import "briar/worker/v1/worker_queue.proto";
import "briar/types/v1/agent_event.proto";
import "briar/types/v1/provider.proto";
import "briar/types/v1/provider_block.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// This protocol is carried as length-delimited protobuf messages over a
// runner process's stdin and stdout. Diagnostics belong on stderr.
//
// A parent sends exactly one RunRequest, may answer ApprovalRequest messages,
// and reads RunnerOutput messages until Result, Blocked, or Error terminates
// the turn. The process boundary is deliberately not modeled as a Connect
// service: it is a private duplex byte stream rather than HTTP.

enum ApprovalPolicy {
  APPROVAL_POLICY_UNSPECIFIED = 0;
  APPROVAL_POLICY_UNTRUSTED = 1;
  APPROVAL_POLICY_ON_REQUEST = 2;
  APPROVAL_POLICY_NEVER = 3;
}

enum SandboxMode {
  SANDBOX_MODE_UNSPECIFIED = 0;
  SANDBOX_MODE_READ_ONLY = 1;
  SANDBOX_MODE_WORKSPACE_WRITE = 2;
  SANDBOX_MODE_DANGER_FULL_ACCESS = 3;
}

enum RunErrorCode {
  RUN_ERROR_CODE_UNSPECIFIED = 0;
  RUN_ERROR_CODE_INVALID_REQUEST = 1;
  RUN_ERROR_CODE_PROVIDER_START_FAILED = 2;
  RUN_ERROR_CODE_PROVIDER_PROTOCOL_ERROR = 3;
  RUN_ERROR_CODE_PROVIDER_FAILED = 4;
  RUN_ERROR_CODE_INTERNAL = 5;
}

// Whether a turn may load the tools the host user configured for the provider
// CLI, independently of `external_tools`. `external_tools=false` is a full
// lockdown (read-only permissions, no web search, no skills); this axis only
// decides whose tool catalog the provider loads.
enum ToolInheritance {
  // Treated as INHERIT so a request written before this field keeps its
  // behaviour.
  TOOL_INHERITANCE_UNSPECIFIED = 0;
  // The provider loads the host user's MCP servers, apps and plugins.
  TOOL_INHERITANCE_INHERIT = 1;
  // The provider loads only the MCP servers Briar passes for this turn. The
  // sandbox mode, network setting, skills and web search stay as requested.
  TOOL_INHERITANCE_BRIAR = 2;
}

enum AgentRunKind {
  AGENT_RUN_KIND_UNSPECIFIED = 0;
  AGENT_RUN_KIND_PARENT = 1;
  AGENT_RUN_KIND_COMPUTER_USE = 2;
}

message ComputerUseChildBinding {
  string parent_run_id = 1;
  string child_run_id = 2;
  string agent_id = 3;
  string managed_computer_id = 4;
  int32 display_index = 5;
  string owner_token = 6;
  briar.types.v1.AgentProvider provider = 7;
}

// A short-lived route from the provider MCP process back to the parent
// Worker. It carries no Worker credential and is valid only while the parent
// owns the matching local socket.
message DmMessagePublicationBinding {
  string invocation_id = 1;
  string socket_path = 2;
  bytes capability = 3;
  google.protobuf.Timestamp expires_at = 4;
  uint32 protocol = 5;
  bool schedule_tools = 6;
}

message DmMessagePublicationPart {
  // Stable within the invocation so a retry can recover the same ordered part.
  string client_id = 1;
  string body = 2;
  briar.app.v1.DmMessagePurpose purpose = 3;
}

message DmMessagePublicationRequest {
  string invocation_id = 1;
  bytes capability = 2;
  string operation_key = 3;
  repeated DmMessagePublicationPart parts = 4;
  optional briar.worker.v1.DmScheduleToolOperation schedule = 5;
}

message DmMessagePublicationReceipt {
  string batch_id = 1;
  repeated string message_ids = 2;
  uint64 first_sequence = 3;
  uint64 last_sequence = 4;
  bool replayed = 5;
}

enum DmMessagePublicationErrorCode {
  DM_MESSAGE_PUBLICATION_ERROR_CODE_UNSPECIFIED = 0;
  DM_MESSAGE_PUBLICATION_ERROR_CODE_INVALID_REQUEST = 1;
  DM_MESSAGE_PUBLICATION_ERROR_CODE_CAPABILITY_INVALID = 2;
  DM_MESSAGE_PUBLICATION_ERROR_CODE_INVOCATION_CLOSED = 3;
  DM_MESSAGE_PUBLICATION_ERROR_CODE_REQUEST_CONFLICT = 4;
  DM_MESSAGE_PUBLICATION_ERROR_CODE_PUBLICATION_UNKNOWN = 5;
  DM_MESSAGE_PUBLICATION_ERROR_CODE_PUBLICATION_FAILED = 6;
}

message DmMessagePublicationError {
  DmMessagePublicationErrorCode code = 1;
  string reason = 2;
}

message DmMessagePublicationResponse {
  oneof result {
    DmMessagePublicationReceipt receipt = 1;
    DmMessagePublicationError error = 2;
    briar.worker.v1.ExecuteDmScheduleToolResponse schedule = 3;
  }
}

message ParentToRunner {
  oneof payload {
    RunRequest run = 1;
    ApprovalResponse approval_response = 2;
  }
}

message RunnerToParent {
  oneof payload {
    SessionStarted session_started = 1;
    ProviderEvent event = 2;
    ApprovalRequest approval = 3;
    RunResult result = 4;
    RunBlocked blocked = 5;
    RunError error = 6;
  }
}

message RunRequest {
  string message = 1;
  string workspace_root = 2;
  optional string conversation_id = 3;
  optional string instructions = 4;
  optional JsonSchema output_schema = 5;
  optional string model = 6;
  optional string effort = 7;
  ApprovalPolicy approval_policy = 8;
  SandboxMode sandbox_mode = 9;
  bool network_access = 10;
  repeated ImageAttachment attachments = 11;
  repeated string additional_directories = 12;
  optional bool external_tools = 13;

  // The runner bundle is provider-specific, so it needs only the executable
  // it must launch. Keeping the field provider-neutral removes six request
  // shapes whose only structural difference was the executable field name.
  string provider_binary_path = 14;

  // SHA-256 of the canonical compiled Briar descriptor image used to generate
  // both endpoints.
  // A runner must reject an empty or mismatched fingerprint; there is no
  // protocol negotiation or legacy fallback between co-shipped binaries.
  bytes protocol_fingerprint = 15;
  AgentRunKind run_kind = 16;
  optional ComputerUseChildBinding computer_use_binding = 17;
  optional string computer_use_mcp_server_path = 18;
  optional DmMessagePublicationBinding dm_message_publication_binding = 19;
  optional string dm_message_mcp_server_path = 20;

  // Independent of `external_tools`: a normal channel reply keeps its sandbox,
  // network access, skills and web search while refusing the host user's own
  // MCP servers, apps and plugins, whose startup cost lands on every turn.
  ToolInheritance tool_inheritance = 21;
}

message JsonSchema {
  oneof value {
    google.protobuf.Struct object = 1;
    bool boolean = 2;
  }
}

message ImageAttachment {
  string path = 1;
  string name = 2;
  string mime_type = 3;
}

message ApprovalResponse {
  string id = 1;
  bool approved = 2;
}

message SessionStarted {
  string session_id = 1;
}

message ProviderEvent {
  // Provider SDK messages are not Briar-owned. They remain the sole open
  // escape hatch while the normalized event beside them is fully typed.
  google.protobuf.Value raw = 1;
  optional briar.types.v1.NormalizedAgentEvent normalized = 2;
  briar.types.v1.AgentEventDirection direction = 3;
}

message ApprovalRequest {
  string id = 1;
  string tool_name = 2;
  google.protobuf.Struct input = 3;
  optional string title = 4;
}

message RunResult {
  string session_id = 1;
  string message = 2;
}

message RunBlocked {
  briar.types.v1.ProviderBlock block = 1;
}

message RunError {
  RunErrorCode code = 1;
  string message = 2;
}
