syntax = "proto3";

package agent.v1;

import "agent/v1/exec.proto";

message ExecStreamElement {
  oneof element {
    ExecClientMessage exec_client_message = 1;
    ExecClientControlMessage exec_client_control_message = 2;
  }
}

service ExecService {
  // buf:lint:ignore RPC_REQUEST_STANDARD_NAME
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc Exec(ExecServerMessage) returns (stream ExecStreamElement);
}
