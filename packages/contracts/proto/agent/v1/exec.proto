syntax = "proto3";

package agent.v1;

import "agent/v1/computer_use_tool.proto";

// Briar implements the Computer Use arm of Grok Bot's shared exec envelope.
// Other Grok exec arms stay reserved so Briar cannot reuse their field numbers.

message ExecClientStreamClose {
  uint32 id = 1;
}

message ExecClientThrow {
  uint32 id = 1;
  string error = 2;
  optional string stack_trace = 3;
  optional string error_code = 4;
}

message ExecClientHeartbeat {
  uint32 id = 1;
}

message ExecClientControlMessage {
  oneof message {
    ExecClientStreamClose stream_close = 1;
    ExecClientThrow throw = 2;
    ExecClientHeartbeat heartbeat = 3;
  }
}

message ExecServerMessage {
  uint32 id = 1;
  reserved 2 to 14;
  string exec_id = 15;
  reserved 16 to 21;

  oneof message {
    ComputerUseArgs computer_use_args = 22;
  }

  reserved 23 to 56;
}

message ExecClientMessage {
  uint32 id = 1;
  reserved 2 to 14;
  string exec_id = 15;
  reserved 16 to 21;

  oneof message {
    ComputerUseResult computer_use_result = 22;
  }

  reserved 23 to 38;
  optional int32 local_execution_time_ms = 39;
  reserved 40 to 56;
}
