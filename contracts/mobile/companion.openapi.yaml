{
  "openapi": "3.1.0",
  "info": {
    "title": "Briar Companion Mobile API",
    "version": "1.0.0",
    "description": "Additive subset shared by native iOS (briar-mobile) and Android (briar-android) Companion clients."
  },
  "servers": [{ "url": "https://briar-api.wbai.workers.dev" }],
  "paths": {
    "/health": {
      "get": {
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "Worker is available",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HealthResponse" } } }
          }
        }
      }
    },
    "/api/auth/device/code": {
      "post": {
        "operationId": "beginDeviceAuthorization",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceCodeRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Device authorization started",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceCodeResponse" } } }
          },
          "400": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/api/auth/device/token": {
      "post": {
        "operationId": "pollDeviceToken",
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceTokenRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Access token issued",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceTokenResponse" } } }
          },
          "400": {
            "description": "Polling state or terminal authorization error",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeviceTokenError" } } }
          }
        }
      }
    },
    "/me": {
      "get": {
        "operationId": "getCurrentUser",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Authenticated user",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CurrentUserResponse" } } }
          },
          "401": { "$ref": "#/components/responses/Error" }
        }
      }
    },
    "/projects": {
      "get": {
        "operationId": "listProjects",
        "security": [{ "bearerAuth": [] }],
        "responses": {
          "200": {
            "description": "Projects visible to the authenticated user",
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProjectsResponse" } } }
          },
          "401": { "$ref": "#/components/responses/Error" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": { "type": "http", "scheme": "bearer" }
    },
    "responses": {
      "Error": {
        "description": "Request failed",
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorResponse" } } }
      }
    },
    "schemas": {
      "MobileClientId": { "type": "string", "enum": ["briar-mobile", "briar-android"] },
      "HealthResponse": {
        "type": "object",
        "required": ["ok", "service", "database", "updates"],
        "properties": {
          "ok": { "const": true },
          "service": { "const": "briar-api" },
          "database": { "type": "string" },
          "updates": { "type": "string" }
        },
        "additionalProperties": true
      },
      "DeviceCodeRequest": {
        "type": "object",
        "required": ["client_id", "scope"],
        "properties": {
          "client_id": { "$ref": "#/components/schemas/MobileClientId" },
          "scope": { "const": "openid profile email" }
        },
        "additionalProperties": false
      },
      "DeviceCodeResponse": {
        "type": "object",
        "required": ["device_code", "user_code", "verification_uri"],
        "properties": {
          "device_code": { "type": "string", "minLength": 1 },
          "user_code": { "type": "string", "minLength": 1 },
          "verification_uri": { "type": "string", "format": "uri" },
          "verification_uri_complete": { "type": "string", "format": "uri" },
          "expires_in": { "type": "integer", "minimum": 1 },
          "interval": { "type": "integer", "minimum": 1, "default": 5 }
        },
        "additionalProperties": true
      },
      "DeviceTokenRequest": {
        "type": "object",
        "required": ["grant_type", "device_code", "client_id"],
        "properties": {
          "grant_type": { "const": "urn:ietf:params:oauth:grant-type:device_code" },
          "device_code": { "type": "string", "minLength": 1 },
          "client_id": { "$ref": "#/components/schemas/MobileClientId" }
        },
        "additionalProperties": false
      },
      "DeviceTokenResponse": {
        "type": "object",
        "required": ["access_token"],
        "properties": {
          "access_token": { "type": "string", "minLength": 1 },
          "token_type": { "type": "string" },
          "expires_in": { "type": "integer", "minimum": 1 }
        },
        "additionalProperties": true
      },
      "DeviceTokenError": {
        "type": "object",
        "required": ["error"],
        "properties": {
          "error": { "type": "string", "enum": ["authorization_pending", "slow_down", "access_denied", "expired_token"] },
          "error_description": { "type": "string" }
        },
        "additionalProperties": true
      },
      "User": {
        "type": "object",
        "required": ["id", "name", "email"],
        "properties": {
          "id": { "type": "string" },
          "username": { "type": ["string", "null"] },
          "name": { "type": "string" },
          "email": { "type": "string", "format": "email" },
          "image": { "type": ["string", "null"] }
        },
        "additionalProperties": true
      },
      "CurrentUserResponse": {
        "type": "object",
        "required": ["user"],
        "properties": { "user": { "$ref": "#/components/schemas/User" } },
        "additionalProperties": true
      },
      "Project": {
        "type": "object",
        "required": ["id", "name", "icon", "organizationId", "organizationName", "role", "createdAt"],
        "properties": {
          "id": { "type": "string", "format": "uuid" },
          "name": { "type": "string" },
          "icon": { "type": ["string", "null"] },
          "organizationId": { "type": "string", "format": "uuid" },
          "organizationName": { "type": "string" },
          "role": { "type": "string", "enum": ["owner", "admin", "member"] },
          "createdAt": { "type": "string", "format": "date-time" }
        },
        "additionalProperties": true
      },
      "ProjectsResponse": {
        "type": "object",
        "required": ["projects"],
        "properties": { "projects": { "type": "array", "items": { "$ref": "#/components/schemas/Project" } } },
        "additionalProperties": true
      },
      "ErrorResponse": {
        "type": "object",
        "required": ["message"],
        "properties": { "message": { "type": "string" } },
        "additionalProperties": true
      }
    }
  }
}
