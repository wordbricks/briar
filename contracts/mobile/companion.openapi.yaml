{
  "openapi": "3.1.0",
  "info": {
    "title": "Briar Companion Mobile API",
    "version": "1.0.0",
    "description": "Additive subset shared by native iOS (briar-mobile) and Android (briar-android) Companion clients."
  },
  "servers": [
    {
      "url": "https://briar-api.wbai.workers.dev"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "Worker is available",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          }
        }
      }
    },
    "/api/auth/device/code": {
      "post": {
        "operationId": "beginDeviceAuthorization",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DeviceCodeRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Device authorization started",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeviceCodeResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/api/auth/device/token": {
      "post": {
        "operationId": "pollDeviceToken",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DeviceTokenRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Access token issued",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeviceTokenResponse"
                }
              }
            }
          },
          "400": {
            "description": "Polling state or terminal authorization error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeviceTokenError"
                }
              }
            }
          }
        }
      }
    },
    "/me": {
      "get": {
        "operationId": "getCurrentUser",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Authenticated user",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CurrentUserResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/inbox/read-states": {
      "get": {
        "operationId": "getInboxReadStates",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Account inbox read versions",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxReadStates"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "put": {
        "operationId": "putInboxReadStates",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/InboxReadStates"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Updated account inbox read versions",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/InboxReadStates"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects": {
      "get": {
        "operationId": "listProjects",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Projects visible to the authenticated user",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProjectsResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/dashboard": {
      "get": {
        "operationId": "getDashboardSnapshot",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Current project dashboard and synchronization cursor",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DashboardSnapshot"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/dashboard/delta": {
      "get": {
        "operationId": "getDashboardDelta",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "name": "cursor",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Dashboard changes after the supplied cursor",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DashboardDelta"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "410": {
            "description": "Cursor retention window expired; request a new snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/CursorExpiredError"
                }
              }
            }
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/events": {
      "get": {
        "operationId": "listRunEvents",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "$ref": "#/components/parameters/RunId"
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Read-only run event history",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RunEventsResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/messages": {
      "get": {
        "operationId": "listIssueMessages",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "$ref": "#/components/parameters/RunId"
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Read-only issue conversation",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IssueMessagesResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "post": {
        "operationId": "createIssueMessage",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "$ref": "#/components/parameters/RunId"
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Message created and optional Agent reply queued"
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/evidence": {
      "get": {
        "operationId": "listRunEvidence",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "$ref": "#/components/parameters/RunId"
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Read-only run evidence",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/RunEvidenceResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/attachments/{attachmentId}": {
      "get": {
        "operationId": "downloadIssueAttachment",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "$ref": "#/components/parameters/RunId"
          },
          {
            "name": "attachmentId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Attachment bytes for native preview",
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "contentEncoding": "binary"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/evidence/images/{imageId}": {
      "get": {
        "operationId": "downloadEvidenceImage",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "$ref": "#/components/parameters/RunId"
          },
          {
            "name": "imageId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Evidence image bytes for native preview",
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "contentEncoding": "binary"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/issues": {
      "post": {
        "operationId": "createIssue",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Issue created"
          },
          "400": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}": {
      "patch": {
        "operationId": "updateIssue",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Issue updated"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "delete": {
        "operationId": "deleteIssue",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Issue deleted"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/preferences": {
      "put": {
        "operationId": "updateIssuePreferences",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Execution preferences updated"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/dependencies/{prerequisiteRunId}": {
      "put": {
        "operationId": "addIssueDependency",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Dependency added"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          }
        }
      },
      "delete": {
        "operationId": "removeIssueDependency",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Dependency removed"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/status": {
      "put": {
        "operationId": "moveRun",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Run status moved idempotently"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/retry": {
      "post": {
        "operationId": "retryRun",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Run retried idempotently"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/cancel": {
      "post": {
        "operationId": "cancelRun",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Run cancelled idempotently"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/resume": {
      "post": {
        "operationId": "resumeRun",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Exact checkpoint approved idempotently"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/dispatch": {
      "post": {
        "operationId": "dispatchRun",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Run dispatched idempotently"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/reassign": {
      "post": {
        "operationId": "reassignRun",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Run reassigned idempotently"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/result-reviews": {
      "post": {
        "operationId": "completeResultReview",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Result review completed"
          }
        }
      }
    },
    "/projects/{projectId}/runs/{runId}/messages/{triggerMessageId}/agent-reply": {
      "get": {
        "operationId": "getIssueAgentReply",
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Current Agent reply status and completed message"
          }
        }
      }
    },
    "/projects/{projectId}/agents": {
      "get": {
        "operationId": "listProjectAgents",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          },
          {
            "name": "locale",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "ko",
                "en",
                "zh"
              ]
            }
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Project agents visible to the authenticated user",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProjectAgentsResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    },
    "/projects/{projectId}/agent-sessions": {
      "get": {
        "operationId": "listProjectAgentSessions",
        "parameters": [
          {
            "$ref": "#/components/parameters/ProjectId"
          }
        ],
        "security": [
          {
            "bearerAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Remote agent session snapshots for the project",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProjectAgentSessionsResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "responses": {
      "Error": {
        "description": "Request failed",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "parameters": {
      "ProjectId": {
        "name": "projectId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      },
      "RunId": {
        "name": "runId",
        "in": "path",
        "required": true,
        "schema": {
          "type": "string",
          "format": "uuid"
        }
      }
    },
    "schemas": {
    "InboxReadStates": {
      "type": "object",
      "required": ["readVersions"],
      "properties": {
        "readVersions": {
          "type": "object",
          "additionalProperties": {
            "type": "string"
          }
        }
      },
      "additionalProperties": false
    },
      "MobileClientId": {
        "type": "string",
        "enum": [
          "briar-mobile",
          "briar-android"
        ]
      },
      "HealthResponse": {
        "type": "object",
        "required": [
          "ok",
          "service",
          "database",
          "updates"
        ],
        "properties": {
          "ok": {
            "const": true
          },
          "service": {
            "const": "briar-api"
          },
          "database": {
            "type": "string"
          },
          "updates": {
            "type": "string"
          }
        },
        "additionalProperties": true
      },
      "DeviceCodeRequest": {
        "type": "object",
        "required": [
          "client_id",
          "scope"
        ],
        "properties": {
          "client_id": {
            "$ref": "#/components/schemas/MobileClientId"
          },
          "scope": {
            "const": "openid profile email"
          }
        },
        "additionalProperties": false
      },
      "DeviceCodeResponse": {
        "type": "object",
        "required": [
          "device_code",
          "user_code",
          "verification_uri"
        ],
        "properties": {
          "device_code": {
            "type": "string",
            "minLength": 1
          },
          "user_code": {
            "type": "string",
            "minLength": 1
          },
          "verification_uri": {
            "type": "string",
            "format": "uri"
          },
          "verification_uri_complete": {
            "type": "string",
            "format": "uri"
          },
          "expires_in": {
            "type": "integer",
            "minimum": 1
          },
          "interval": {
            "type": "integer",
            "minimum": 1,
            "default": 5
          }
        },
        "additionalProperties": true
      },
      "DeviceTokenRequest": {
        "type": "object",
        "required": [
          "grant_type",
          "device_code",
          "client_id"
        ],
        "properties": {
          "grant_type": {
            "const": "urn:ietf:params:oauth:grant-type:device_code"
          },
          "device_code": {
            "type": "string",
            "minLength": 1
          },
          "client_id": {
            "$ref": "#/components/schemas/MobileClientId"
          }
        },
        "additionalProperties": false
      },
      "DeviceTokenResponse": {
        "type": "object",
        "required": [
          "access_token"
        ],
        "properties": {
          "access_token": {
            "type": "string",
            "minLength": 1
          },
          "token_type": {
            "type": "string"
          },
          "expires_in": {
            "type": "integer",
            "minimum": 1
          }
        },
        "additionalProperties": true
      },
      "DeviceTokenError": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "string",
            "enum": [
              "authorization_pending",
              "slow_down",
              "access_denied",
              "expired_token"
            ]
          },
          "error_description": {
            "type": "string"
          }
        },
        "additionalProperties": true
      },
      "User": {
        "type": "object",
        "required": [
          "id",
          "name",
          "email"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "username": {
            "type": [
              "string",
              "null"
            ]
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string",
            "format": "email"
          },
          "image": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "additionalProperties": true
      },
      "CurrentUserResponse": {
        "type": "object",
        "required": [
          "user"
        ],
        "properties": {
          "user": {
            "$ref": "#/components/schemas/User"
          }
        },
        "additionalProperties": true
      },
      "Project": {
        "type": "object",
        "required": [
          "id",
          "name",
          "icon",
          "organizationId",
          "organizationName",
          "role",
          "createdAt"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "icon": {
            "type": [
              "string",
              "null"
            ]
          },
          "organizationId": {
            "type": "string",
            "format": "uuid"
          },
          "organizationName": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "owner",
              "admin",
              "member"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          }
        },
