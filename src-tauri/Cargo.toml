[package]
name = "briar"
version = "0.1.0"
description = "Agent Development Environment"
authors = ["Wordbricks"]
edition = "2021"

[lib]
name = "briar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
keyring = "4.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2.5.4"
